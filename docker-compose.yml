services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-u",
        "root",
        "-p${DB_ROOT_PASSWORD}"
      ]
      interval: 5s
      timeout: 5s
      retries: 20
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      secrets:
        - nova_username
        - nova_license_key
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"
    command: ["sh", "docker/php-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "storage/framework/app-ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  go:
    build:
      context: .
      dockerfile: docker/go-api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8081"
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "wget",
        "--spider",
        "-q",
        "http://localhost:8081/healthz"
      ]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
      go:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: [
        "CMD",
        "wget",
        "--spider",
        "-q",
        "http://localhost/"
      ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
    driver: local
secrets:
  nova_username:
    environment: NOVA_USERNAME
  nova_license_key:
    environment: NOVA_LICENSE_KEY
networks:
  payarc-network:
    driver: bridge
