services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-u",
        "root",
        "-p${DB_ROOT_PASSWORD}"
      ]
      interval: 5s
      timeout: 5s
      retries: 20
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      secrets:
        - nova_username
        - nova_license_key
    restart: unless-stopped
    working_dir: /var/www/html/php
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - php-vendor:/var/www/html/php/vendor
      - php-containers-vendor:/var/www/html/php/app/Containers/Vendor
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9000"
    command: ["sh", "../docker/php-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "storage/framework/app-ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  go:
    build:
      context: .
      dockerfile: docker/go-api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8081"
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://localhost:8081/healthz"
      ]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_healthy
      go:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: [
        "CMD",
        "wget",
        "--spider",
        "-q",
        "--header=Host: localhost",
        "http://127.0.0.1/"
      ]
      interval: 5s
      timeout: 5s
      retries: 30

  go-test:
    image: golang:1.22-alpine
    profiles: ["test"]
    working_dir: /workspace/go-api
    env_file:
      - .env
    volumes:
      - .:/workspace:ro
    depends_on:
      php:
        condition: service_healthy
    command: ["go", "test", "./..."]

  web-test:
    image: node:22-alpine
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./web:/src:ro
      - web-test-node-modules:/app/node_modules
    command: ["sh", "-c", "cp -R /src/. /app/ && npm ci && npm test -- --run && npm run typecheck"]

volumes:
  mysql-data:
    driver: local
  php-vendor:
    driver: local
  php-containers-vendor:
    driver: local
  web-test-node-modules:
    driver: local
secrets:
  nova_username:
    environment: NOVA_USERNAME
  nova_license_key:
    environment: NOVA_LICENSE_KEY
networks:
  payarc-network:
    driver: bridge
